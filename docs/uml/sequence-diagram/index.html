<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScholarMatch — Sequence Diagrams</title>
<style>
    :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --bg-alt: #f5f6f8;
        --text: #1a1f2b;
        --text-muted: #5b6472;
        --border: #e2e5ea;
        --accent: #6d4bd6;
        --accent-bg: #f2edfd;
    }

    @media (prefers-color-scheme: dark) {
        :root {
            --bg: #14161c;
            --bg-alt: #1c1f27;
            --text: #eceef2;
            --text-muted: #9aa2b1;
            --border: #2b2f3a;
            --accent: #b39dff;
            --accent-bg: #262038;
        }
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        color: var(--text);
        background: var(--bg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    button { font: inherit; }

    nav {
        position: sticky;
        top: 0;
        width: 260px;
        height: 100vh;
        flex-shrink: 0;
        overflow-y: auto;
        padding: 24px 0;
        background: var(--bg-alt);
        border-right: 1px solid var(--border);
    }

    nav h1 {
        margin: 0 20px 4px;
        font-size: 15px;
        letter-spacing: 0.02em;
    }

    nav p {
        margin: 0 20px 20px;
        color: var(--text-muted);
        font-size: 12px;
    }

    nav ul {
        margin: 0;
        padding: 0;
        list-style: none;
    }

    nav a {
        display: block;
        padding: 8px 20px;
        color: var(--text);
        border-left: 3px solid transparent;
        font-size: 13px;
        text-decoration: none;
    }

    nav a:hover,
    nav a:focus-visible {
        background: var(--accent-bg);
        outline: none;
    }

    nav a.active {
        color: var(--accent);
        background: var(--accent-bg);
        border-left-color: var(--accent);
        font-weight: 600;
    }

    nav a.missing { color: var(--text-muted); }

    main {
        min-width: 0;
        flex: 1;
        padding: 40px clamp(20px, 5vw, 64px) 72px;
    }

    main > header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 40px;
    }

    main > header h1 {
        margin: 0 0 8px;
        font-size: 26px;
    }

    main > header p {
        max-width: 700px;
        margin: 0;
        color: var(--text-muted);
        line-height: 1.5;
    }

    .view-controls {
        display: flex;
        flex-wrap: wrap;
        flex-shrink: 0;
        gap: 6px;
    }

    .view-controls button {
        padding: 6px 9px;
        color: var(--text);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 4px;
        cursor: pointer;
        font-size: 12px;
    }

    .view-controls button:hover,
    .view-controls button:focus-visible,
    .view-controls button.active {
        color: var(--accent);
        background: var(--accent-bg);
        border-color: var(--accent);
        outline: none;
    }

    section.usecase {
        margin-bottom: 56px;
        scroll-margin-top: 24px;
    }

    .section-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 12px;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--border);
    }

    .section-heading h2 {
        margin: 0;
        font-size: 18px;
    }

    .section-heading a {
        flex-shrink: 0;
        color: var(--text-muted);
        font-size: 12px;
        text-decoration: none;
    }

    .section-heading a:hover,
    .section-heading a:focus-visible {
        color: var(--accent);
        outline: none;
    }

    .frame {
        overflow: auto;
        background: light-dark(#ffffff, #191a1d);
        border: 1px solid var(--border);
        border-radius: 6px;
    }

    .sequence-svg {
        display: block;
        width: 100%;
        height: auto;
        min-width: 760px;
    }

    body.actual-size .sequence-svg {
        width: auto;
        max-width: none;
    }

    .sequence-svg .participant-box {
        fill: light-dark(#f2edfd, #262038);
        stroke: var(--accent);
        stroke-width: 1.5;
    }

    .sequence-svg .participant-name,
    .sequence-svg .message-label,
    .sequence-svg .fragment-label,
    .sequence-svg .note-label {
        fill: var(--text);
    }

    .sequence-svg .participant-role,
    .sequence-svg .package-label {
        fill: var(--text-muted);
    }

    .sequence-svg .lifeline,
    .sequence-svg .message-line,
    .sequence-svg .fragment-line {
        stroke: light-dark(#6b7280, #aeb4c0);
    }

    .sequence-svg .lifeline {
        stroke-dasharray: 6 5;
    }

    .sequence-svg .message-line.return {
        stroke-dasharray: 8 5;
    }

    .sequence-svg .message-line.error,
    .sequence-svg .message-label.error {
        stroke: light-dark(#b42318, #ff8a80);
        fill: light-dark(#b42318, #ff8a80);
    }

    .sequence-svg .arrow-head {
        fill: light-dark(#4b5563, #c4c9d2);
    }

    .sequence-svg .arrow-head.error {
        fill: light-dark(#b42318, #ff8a80);
    }

    .sequence-svg .activation {
        fill: light-dark(#f8f8fa, #2b2f3a);
        stroke: light-dark(#818794, #aeb4c0);
    }

    .sequence-svg .fragment-box {
        fill: none;
        stroke: light-dark(#8a909c, #8f96a3);
    }

    .sequence-svg .note-box {
        fill: light-dark(#fff8c5, #443d20);
        stroke: light-dark(#b79700, #d4b72c);
    }

    .source-summary {
        display: block;
        margin-top: 6px;
        font-size: 12px;
    }

    .top-link {
        display: inline-block;
        margin-top: 10px;
        color: var(--text-muted);
        font-size: 12px;
        text-decoration: none;
    }

    .top-link:hover { color: var(--accent); }

    @media (max-width: 900px) {
        body { display: block; }
        nav {
            position: static;
            width: auto;
            height: auto;
            padding: 16px 0;
            border-right: 0;
            border-bottom: 1px solid var(--border);
        }
        nav p { margin-bottom: 10px; }
        nav ul { display: flex; overflow-x: auto; }
        nav a { white-space: nowrap; border-left: 0; border-bottom: 2px solid transparent; }
        nav a.active { border-bottom-color: var(--accent); }
        main { padding-top: 28px; }
    }

    @media (max-width: 680px) {
        main > header { display: block; }
        .view-controls { margin-top: 14px; }
    }
</style>
</head>
<body id="top" class="actual-size">
<nav>
    <h1>Sequence Diagrams</h1>
    <p>Choose a use case</p>
    <ul id="nav-list"></ul>
</nav>

<main>
    <header>
        <div>
            <h1>ScholarMatch — Sequence Diagrams</h1>
            <p>
                One sequence diagram per use case, showing the runtime calls between controllers,
                boundaries, interactors, presenters, gateways, and data objects.
                <span class="source-summary" id="source-summary"></span>
            </p>
        </div>
        <div class="view-controls" aria-label="Diagram controls">
            <button type="button" id="online-mode" class="active">Online adapters</button>
            <button type="button" id="offline-mode">Offline repositories</button>
            <button type="button" id="fit-width">Fit width</button>
            <button type="button" id="actual-size" class="active">Actual size</button>
        </div>
    </header>

    <div id="diagram-list"></div>
</main>

<script src="../class-diagram/uml-members.js"></script>
<script src="sequence-specs.js"></script>
<script>
    const useCases = window.SEQUENCE_SPECS || [];
    const umlTypes = window.UML_TYPES || {};
    let accessMode = "online";

    const legacyImages = {
        AcceptApplication: "AcceptApplicationSequence-ZhijieYuan.png",
        ApplyToPosting: "ApplyToPostingSequence-MarianLin.png",
        ChangeEmail: "ChangeEmailSequence-AlanXue.png",
        ChangePassword: "ChangePasswordSequence-AlanXue.png",
        ClosePosting: "ClosePostingSequence-MarianLin.png",
        Connect: "ConnectSequence-MarianLin.png",
        CreatePosting: "CreatePostingSequence-MarianLin.png",
        DeclineApplication: "DeclineApplicationSequence-ZhijieYuan.png",
        DeleteAccount: "DeleteAccountSequence-AlanXue.png",
        Dislike: "DislikeSequence-MarianLin.png",
        LoadMatches: "LoadMatches-GuanchengChen.png",
        LoadMessage: "LoadMessageSequence-GuanchengChen.png",
        LoadMyApplications: "LoadMyApplicationsSequence-ZhijieYuan.png",
        LoadPostings: "LoadPostingsSequence-MarianLin.png",
        LoadProfile: "LoadProfileSequence-ZhijieYuan.png",
        Login: "LoginSequence-AlanXue.png.png",
        Logout: "LogoutSequence-AlanXue.png.png",
        PaperLookup: "PaperLookupSequence-ZhijieYuan.png",
        Recommend: "Recommend-GuanchengChen.png",
        Register: "RegisterSequence-AlanXue.png.png",
        RequestEmailVerification: "RequestEmailVerificationSequence-AlanXue.png",
        SendMessage: "SendMessageSequence-GuanchengChen.png",
        Skip: "SkipSequence-MarianLin.png",
        UpdateProfile: "UpdateProfileSequence-ZhijieYuan.png"
    };

    function titleCase(name) {
        return name.replace(/([a-z0-9])([A-Z])/g, "$1 $2");
    }

    function escapeHtml(value) {
        return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;");
    }

    function simpleTypeNames(value) {
        return String(value)
            .split(/\s*(?:\/|→)\s*/)
            .map((part) => part.replace(/\s*\([^)]*\)\s*$/, "").trim())
            .filter(Boolean);
    }

    function packageLabel(value) {
        const packages = [...new Set(simpleTypeNames(value)
            .map((name) => umlTypes[name]?.packageName)
            .filter(Boolean))];
        if (!packages.length) return "runtime collaborator";
        return packages.map((name) => name.replace("com.scholarmatch.", "")).join(" / ");
    }

    function unique(values) {
        return [...new Set(values.filter(Boolean))];
    }

    function participantsFor(spec) {
        const ports = unique(spec.dataCalls.map((call) => call.port)).join(" / ");
        const adapters = unique(spec.dataCalls.map((call) => call[accessMode])).join(" / ");
        return [
            { id: "view", role: "UI", name: spec.view },
            { id: "controller", role: "Controller", name: spec.controller },
            { id: "boundary", role: "Input boundary", name: spec.inputBoundary },
            { id: "interactor", role: "Use case", name: spec.interactor },
            { id: "port", role: "Data-access port", name: ports },
            { id: "adapter", role: accessMode === "online" ? "Online adapter" : "Offline repository", name: adapters },
            { id: "output", role: "Output boundary", name: spec.outputBoundary },
            { id: "presenter", role: "Presenter", name: spec.presenter },
            { id: "viewModel", role: "View model", name: spec.viewModel }
        ].filter((participant) => participant.name);
    }

    function messagesFor(spec) {
        const messages = [];
        if (spec.controller) messages.push({ from: "view", to: "controller", label: spec.entry });
        if (spec.inputBoundary) {
            messages.push({ from: "controller", to: "boundary", label: spec.inputData ? `new ${spec.inputData}` : spec.request });
            messages.push({ from: "boundary", to: "interactor", label: spec.request });
        }
        if (spec.validation) messages.push({ kind: "note", label: `Validation: ${spec.validation}` });

        spec.dataCalls.forEach((call) => {
            messages.push({ from: "interactor", to: "port", label: call.call });
            messages.push({ from: "port", to: "adapter", label: call.call });
            if (call.result && call.result !== "void") {
                messages.push({ from: "adapter", to: "port", label: call.result, return: true });
                messages.push({ from: "port", to: "interactor", label: call.result, return: true });
            }
        });

        if (spec.outputBoundary) messages.push({ from: "interactor", to: "output", label: spec.success });
        if (spec.presenter) messages.push({ from: "output", to: "presenter", label: spec.success });
        if (spec.viewModel) messages.push({ from: "presenter", to: "viewModel", label: spec.viewUpdate });
        else if (spec.viewUpdate) messages.push({ kind: "note", label: spec.viewUpdate });

        if (spec.failure) {
            messages.push({ kind: "fragment", label: "alt — validation or data-access failure" });
            messages.push({ from: "interactor", to: "output", label: spec.failure, error: true });
            messages.push({ from: "output", to: "presenter", label: spec.failure, error: true });
            if (spec.viewModel) {
                messages.push({ from: "presenter", to: "viewModel", label: spec.failureViewUpdate, error: true });
            }
        }
        if (spec.note) messages.push({ kind: "note", label: spec.note });
        if (spec.outputData) messages.push({ kind: "note", label: `Data objects: ${spec.inputData || "none"} → ${spec.outputData}` });
        return messages;
    }

    function truncate(value, limit) {
        return value.length > limit ? `${value.slice(0, limit - 1)}…` : value;
    }

    function renderSequence(svg, spec) {
        const participants = participantsFor(spec);
        const messages = messagesFor(spec);
        const participantById = new Map(participants.map((participant, index) => [participant.id, { ...participant, index }]));
        const laneWidth = 210;
        const marginX = 86;
        const boxWidth = 174;
        const boxHeight = 66;
        const topY = 26;
        const firstMessageY = 134;
        const rowHeight = 58;
        const bottomY = firstMessageY + messages.length * rowHeight + 28;
        const width = Math.max(860, marginX * 2 + (participants.length - 1) * laneWidth);
        const height = bottomY + boxHeight + 28;
        const xOf = (id) => marginX + participantById.get(id).index * laneWidth;

        const participantMarkup = participants.map((participant, index) => {
            const x = marginX + index * laneWidth;
            const label = truncate(participant.name, 25);
            const sourcePackage = packageLabel(participant.name);
            return `
                <g>
                    <title>${escapeHtml(participant.name)} — ${escapeHtml(sourcePackage)}</title>
                    <rect class="participant-box" x="${x - boxWidth / 2}" y="${topY}" width="${boxWidth}" height="${boxHeight}" rx="4"></rect>
                    <text class="participant-name" x="${x}" y="${topY + 27}" text-anchor="middle" font-size="13" font-weight="600">${escapeHtml(label)}</text>
                    <text class="participant-role" x="${x}" y="${topY + 49}" text-anchor="middle" font-size="11">${escapeHtml(participant.role)}</text>
                    <line class="lifeline" x1="${x}" y1="${topY + boxHeight}" x2="${x}" y2="${bottomY}"></line>
                    <rect class="activation" x="${x - 5}" y="${firstMessageY - 14}" width="10" height="${Math.max(32, bottomY - firstMessageY + 14)}"></rect>
                    <rect class="participant-box" x="${x - boxWidth / 2}" y="${bottomY}" width="${boxWidth}" height="${boxHeight}" rx="4"></rect>
                    <text class="participant-name" x="${x}" y="${bottomY + 38}" text-anchor="middle" font-size="13" font-weight="600">${escapeHtml(label)}</text>
                </g>`;
        }).join("");

        const messageMarkup = messages.map((message, index) => {
            const y = firstMessageY + index * rowHeight;
            if (message.kind === "note") {
                return `
                    <g>
                        <rect class="note-box" x="${marginX - boxWidth / 2}" y="${y - 23}" width="${width - marginX * 2 + boxWidth}" height="38" rx="3"></rect>
                        <text class="note-label" x="${marginX - boxWidth / 2 + 12}" y="${y + 1}" font-size="12">${escapeHtml(truncate(message.label, 170))}</text>
                    </g>`;
            }
            if (message.kind === "fragment") {
                return `
                    <g>
                        <line class="fragment-line" x1="${marginX - boxWidth / 2}" y1="${y}" x2="${width - marginX + boxWidth / 2}" y2="${y}" stroke-dasharray="9 6"></line>
                        <rect class="fragment-box" x="${marginX - boxWidth / 2}" y="${y - 18}" width="300" height="28"></rect>
                        <text class="fragment-label" x="${marginX - boxWidth / 2 + 10}" y="${y + 1}" font-size="12">${escapeHtml(message.label)}</text>
                    </g>`;
            }

            const fromX = xOf(message.from);
            const toX = xOf(message.to);
            const labelX = (fromX + toX) / 2;
            const labelClass = message.error ? "message-label error" : "message-label";
            const lineClass = `message-line${message.return ? " return" : ""}${message.error ? " error" : ""}`;
            const marker = message.error ? "url(#arrow-error)" : "url(#arrow)";
            return `
                <g>
                    <line class="${lineClass}" x1="${fromX}" y1="${y}" x2="${toX}" y2="${y}" stroke-width="1.5" marker-end="${marker}"></line>
                    <text class="${labelClass}" x="${labelX}" y="${y - 8}" text-anchor="middle" font-size="12">${escapeHtml(truncate(message.label, 54))}</text>
                </g>`;
        }).join("");

        svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
        svg.setAttribute("width", width);
        svg.setAttribute("height", height);
        svg.innerHTML = `
            <title>${escapeHtml(titleCase(spec.name))} sequence diagram using ${accessMode} data access</title>
            <desc>Runtime calls from the UI through Clean Architecture boundaries and the selected data-access implementation.</desc>
            <defs>
                <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                    <path class="arrow-head" d="M 0 0 L 10 5 L 0 10 z"></path>
                </marker>
                <marker id="arrow-error" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                    <path class="arrow-head error" d="M 0 0 L 10 5 L 0 10 z"></path>
                </marker>
            </defs>
            ${participantMarkup}
            ${messageMarkup}`;
    }

    const navList = document.getElementById("nav-list");
    const diagramList = document.getElementById("diagram-list");
    const sourceSummary = document.getElementById("source-summary");

    useCases.forEach((spec) => {
        const navItem = document.createElement("li");
        navItem.innerHTML = `<a href="#uc-${spec.name}">${titleCase(spec.name)}</a>`;
        navList.appendChild(navItem);

        const section = document.createElement("section");
        section.className = "usecase";
        section.id = `uc-${spec.name}`;
        section.innerHTML = `
            <div class="section-heading">
                <h2>${titleCase(spec.name)}</h2>
                <span>
                    <a href="../class-diagram/index.html#uml-${spec.name}">Class diagram →</a>
                    · <a href="${legacyImages[spec.name]}">Legacy PNG</a>
                </span>
            </div>
            <div class="frame">
                <svg class="sequence-svg" role="img" aria-label="${titleCase(spec.name)} sequence diagram" data-usecase="${spec.name}"></svg>
            </div>
            <a class="top-link" href="#top">↑ back to top</a>`;
        diagramList.appendChild(section);
        renderSequence(section.querySelector("svg"), spec);
    });

    sourceSummary.textContent = `${useCases.length} live diagrams checked against the current src/main/java tree; participant tooltips show current packages.`;

    const fitWidth = document.getElementById("fit-width");
    const actualSize = document.getElementById("actual-size");
    const onlineMode = document.getElementById("online-mode");
    const offlineMode = document.getElementById("offline-mode");

    function setSizeMode(actual) {
        document.body.classList.toggle("actual-size", actual);
        fitWidth.classList.toggle("active", !actual);
        actualSize.classList.toggle("active", actual);
    }

    function setAccessMode(mode) {
        accessMode = mode;
        onlineMode.classList.toggle("active", mode === "online");
        offlineMode.classList.toggle("active", mode === "offline");
        document.querySelectorAll(".sequence-svg").forEach((svg) => {
            const spec = useCases.find((candidate) => candidate.name === svg.dataset.usecase);
            renderSequence(svg, spec);
        });
    }

    fitWidth.addEventListener("click", () => setSizeMode(false));
    actualSize.addEventListener("click", () => setSizeMode(true));
    onlineMode.addEventListener("click", () => setAccessMode("online"));
    offlineMode.addEventListener("click", () => setAccessMode("offline"));

    const navLinks = [...navList.querySelectorAll("a")];
    const observer = new IntersectionObserver((entries) => {
        const visible = entries.filter((entry) => entry.isIntersecting)
            .sort((left, right) => right.intersectionRatio - left.intersectionRatio)[0];
        if (!visible) return;
        navLinks.forEach((link) => link.classList.toggle("active", link.hash === `#${visible.target.id}`));
    }, { rootMargin: "-12% 0px -70% 0px", threshold: [0.01, 0.2] });

    document.querySelectorAll("section.usecase").forEach((section) => observer.observe(section));

    requestAnimationFrame(() => {
        const target = location.hash ? document.querySelector(location.hash) : null;
        if (target) target.scrollIntoView({ block: "start" });
    });
</script>
</body>
</html>
